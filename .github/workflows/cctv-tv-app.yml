name: Build Home CCTV TV app

on:
  push:
    paths:
      - "cctv-tv-app/**"
      - ".github/workflows/cctv-tv-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cctv-tv-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk HomeCCTV-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HomeCCTV-TV-apk
          path: cctv-tv-app/HomeCCTV-TV.apk

      - name: Publish APK as a GitHub release (direct download link for the TV)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cctv-tv-v1.0-build${{ github.run_number }}
          name: Home CCTV TV app (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: cctv-tv-app/HomeCCTV-TV.apk
          body: Sideload HomeCCTV-TV.apk onto your Android TV / Google TV (Sony Bravia). See cctv-tv-app/README.md.
